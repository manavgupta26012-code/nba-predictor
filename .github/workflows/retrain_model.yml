name: Weekly Deep Refresh & Retrain

# Runs every Sunday at 6am UTC. This is the "don't let the data go stale
# again" job -- it re-pulls the FULL multi-season history (not just the
# current season) and retrains the model on it. Generous 3-hour timeout
# since this only runs weekly, so there's no rush and no cost to letting
# it take a while.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Collect full historical + current season data
        run: |
          python src/collect_data.py --seasons 2021-22 2022-23 2023-24 2024-25 2025-26 2026-27
          python src/collect_player_data.py --seasons 2021-22 2022-23 2023-24 2024-25 2025-26 2026-27

      - name: Rebuild features
        run: python src/build_features.py

      - name: Retrain model
        run: python src/train_model.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ models/
          git diff --staged --quiet || git commit -m "Weekly retrain $(date -u +'%Y-%m-%d')"
          git push
